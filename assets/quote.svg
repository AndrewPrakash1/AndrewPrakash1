<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="168" viewBox="0 0 1200 168">
  <title>The work</title>
  <style>
    text { font-family: "Courier New", Courier, "Liberation Mono", monospace; }
  </style>
  <rect width="1200" height="168" fill="#0d1117"/>
  <rect x="72" y="28" width="3" height="112" fill="#ff2a3c"/>
  <text x="96" y="62" fill="#e7c9cf" font-size="16">I build systems that turn real-world signals into measurable models.</text>
  <text x="96" y="88" fill="#e7c9cf" font-size="16">Not just demos.</text>
  <text x="96" y="124" fill="#a88490" font-size="14">Somewhere under the noise there is a number that stays true</text>
  <text x="96" y="146" fill="#a88490" font-size="14">when the room goes quiet. That is the work.</text>
</svg>
