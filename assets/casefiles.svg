<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="392" viewBox="0 0 1200 392">
  <title>Case files</title>
  <style>
    text { font-family: "Courier New", Courier, "Liberation Mono", monospace; }
    @keyframes rec {
      0%, 48% { opacity: 1; }
      50%, 100% { opacity: 0.15; }
    }
    .rec { animation: rec 1.3s steps(1) infinite; }
  </style>
  <rect width="1200" height="392" fill="#0d1117"/>
  <circle class="rec" cx="48" cy="36" r="4" fill="#ff2a3c"/>
  <text x="64" y="41" fill="#e8c9cf" font-size="16" letter-spacing="4">CASE FILES</text>
  <text x="860" y="41" fill="#8d6a62" font-size="13" letter-spacing="2">OPEN THE LINKS BELOW</text>
  <line x1="48" y1="58" x2="1152" y2="58" stroke="#5c2030" stroke-width="1"/>
  <g fill="#8d6a62" font-size="12" letter-spacing="1.5">
    <text x="48" y="92">NO.</text>
    <text x="130" y="92">FILE</text>
    <text x="360" y="92">WHAT IT HOLDS</text>
  </g>
  <g fill="#e7c9cf" font-size="16">
    <text x="48" y="132" fill="#ff5b6b">001</text>
    <text x="130" y="132">ONEPASS</text>
    <text x="360" y="132" fill="#c9b4b8" font-size="14">Single-pass drone video to georeferenced 3D</text>
    <text x="48" y="180" fill="#ff5b6b">002</text>
    <text x="130" y="180">HEAT SINK</text>
    <text x="360" y="180" fill="#c9b4b8" font-size="14">Live CPU power to a real-time heat-sink field</text>
    <text x="48" y="228" fill="#ff5b6b">003</text>
    <text x="130" y="228">REGINTEL</text>
    <text x="360" y="228" fill="#c9b4b8" font-size="14">Regulatory docs turned into structured insights</text>
    <text x="48" y="276" fill="#ff5b6b">004</text>
    <text x="130" y="276">GPT</text>
    <text x="360" y="276" fill="#c9b4b8" font-size="14">Decoder-only GPT implemented in Python</text>
    <text x="48" y="324" fill="#ff5b6b">005</text>
    <text x="130" y="324">CRICSCOPE</text>
    <text x="360" y="324" fill="#c9b4b8" font-size="14">Cricket analytics, visuals, and predictions</text>
  </g>
  <g stroke="#2a1218" stroke-width="1">
    <line x1="48" y1="148" x2="1152" y2="148"/>
    <line x1="48" y1="196" x2="1152" y2="196"/>
    <line x1="48" y1="244" x2="1152" y2="244"/>
    <line x1="48" y1="292" x2="1152" y2="292"/>
    <line x1="48" y1="340" x2="1152" y2="340"/>
  </g>
  <text x="48" y="372" fill="#6e534c" font-size="12" letter-spacing="2">THE NAMES BELOW ARE THE DOORS.</text>
</svg>
