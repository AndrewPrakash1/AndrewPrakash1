<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="180" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180">
  <style>
    @keyframes swim {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(900px);
      }
    }
    
    @keyframes bubble-float {
      0% {
        transform: translate(0, 0);
        opacity: 0.75;
      }
      100% {
        transform: translate(20px, -70px);
        opacity: 0;
      }
    }
    
    @keyframes wave-sway {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-2.5px);
      }
    }
    
    .shark-group {
      animation: swim 12s linear infinite;
      animation-delay: -1s;
    }
    
    .bubble {
      animation: bubble-float 3s ease-out infinite;
    }
    
    .bubble-1 { animation-delay: 0.0s; }
    .bubble-2 { animation-delay: 0.6s; }
    .bubble-3 { animation-delay: 1.2s; }
    .bubble-4 { animation-delay: 1.8s; }
    .bubble-5 { animation-delay: 2.4s; }
    .bubble-6 { animation-delay: 3.0s; }
    
    .wave {
      animation: wave-sway 2s ease-in-out infinite;
    }
    
    .wave-1 { animation-delay: 0.0s; }
    .wave-2 { animation-delay: 0.3s; }
    .wave-3 { animation-delay: 0.6s; }
    .wave-4 { animation-delay: 0.9s; }
    .wave-5 { animation-delay: 1.2s; }
    .wave-6 { animation-delay: 1.5s; }
    
    text {
      font-family: 'Courier New', Courier, 'Lucida Console', Monaco, monospace;
      font-size: 13px;
      font-weight: 700;
    }
    
    /* Light theme colors */
    .shark-fill { fill: #1e4d8b; }
    .bubble-fill { fill: #2196f3; }
    .wave-fill { fill: #00897b; }
    
    /* Dark theme colors */
    @media (prefers-color-scheme: dark) {
      .shark-fill { fill: #c5d9ed; }
      .bubble-fill { fill: #42a5f5; }
      .wave-fill { fill: #26a69a; }
    }
  </style>
  
  <!-- Bottom wave decoration -->
  <g>
    <text x="30" y="165" class="wave-fill wave wave-1" xml:space="preserve">~~~~~~</text>
    <text x="180" y="168" class="wave-fill wave wave-2" xml:space="preserve">~~~~~~~</text>
    <text x="350" y="166" class="wave-fill wave wave-3" xml:space="preserve">~~~~~~</text>
    <text x="520" y="169" class="wave-fill wave wave-4" xml:space="preserve">~~~~~~~</text>
    <text x="690" y="167" class="wave-fill wave wave-5" xml:space="preserve">~~~~~~</text>
    <text x="860" y="170" class="wave-fill wave wave-6" xml:space="preserve">~~~~~~~</text>
  </g>
  
  <!-- Swimming shark - continuous torpedo body -->
  <g class="shark-group">
    <g class="shark-body">
      <!-- Continuous shark body: tail (left) to head (right) -->
      <text x="0" y="60" class="shark-fill" xml:space="preserve">                             /\</text>
      <text x="0" y="73" class="shark-fill" xml:space="preserve">                            /  \</text>
      <text x="0" y="86" class="shark-fill" xml:space="preserve">                    _______/    \                      ___</text>
      <text x="0" y="99" class="shark-fill" xml:space="preserve">          ___,,---''                ``---._        _,-'o  `-._</text>
      <text x="0" y="112" class="shark-fill" xml:space="preserve">     ___/                                   `----''    ^    _))</text>
      <text x="0" y="125" class="shark-fill" xml:space="preserve">  &lt;&lt;&lt;                                                 VVV</text>
      <text x="0" y="138" class="shark-fill" xml:space="preserve">     ```\___                                ____    _.--'`</text>
      <text x="0" y="151" class="shark-fill" xml:space="preserve">          ```''---...__                _.--'   `''`</text>
      <text x="0" y="164" class="shark-fill" xml:space="preserve">                      ``'''''''''''''`</text>
    </g>
    
    <!-- Trailing bubbles -->
    <g class="bubbles">
      <text x="-35" y="95" class="bubble-fill bubble bubble-1" xml:space="preserve">o</text>
      <text x="-50" y="110" class="bubble-fill bubble bubble-2" xml:space="preserve">o</text>
      <text x="-28" y="125" class="bubble-fill bubble bubble-3" xml:space="preserve">o</text>
      <text x="-60" y="100" class="bubble-fill bubble bubble-4" xml:space="preserve">o</text>
      <text x="-42" y="135" class="bubble-fill bubble bubble-5" xml:space="preserve">o</text>
      <text x="-55" y="118" class="bubble-fill bubble bubble-6" xml:space="preserve">o</text>
    </g>
  </g>
</svg>
